---
# runs on each push to main and is responsible for creating new tags/releases
name: Create Semantic Release

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  semantic-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.semrel.outputs.version }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.ADFINIS_RELEASES_GITHUB_CLIENT_ID }}
          private-key: ${{ secrets.ADFINIS_RELEASES_GITHUB_APP_PRIVATE_KEY }}
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run go-semantic-release
        id: semrel
        uses: go-semantic-release/action@2e9dc4247a6004f8377781bef4cb9dad273a741f # v1.24.1
        with:
          allow-initial-development-versions: true
          github-token: ${{ steps.app-token.outputs.token }}

  ansible-galaxy:
    needs: semantic-release
    if: needs.semantic-release.outputs.version != ''
    uses: adfinis/github-workflows-bareos/.github/workflows/ansible-galaxy-role-release.yaml@a833edc3ef3b044b24c8d1bc942d97b6f3a0609e # v0.11.0
    secrets:
      galaxy_api_key: ${{ secrets.GALAXY_API_KEY }}
